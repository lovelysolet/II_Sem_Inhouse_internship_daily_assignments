<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Landing Page</title>
<link rel="stylesheet" href="style.css">
</head>

<body>
    <center>

<div class="container">

<h1>Welcome to My Landing Page</h1>

<p>Learn HTML, CSS and JavaScript.</p>

<input type="text" id="name" placeholder="Enter your name">
<p id="error"></p>

<h2 id="count">Count: 0</h2>

<button id="countBtn">Click Me</button>
<button id="resetBtn">Reset</button>
<button id="darkBtn">Dark Mode</button>

</div>

<script src="script.js"></script>
</center>

</body>
</html>
<script>
    let count = 0;

// Click Counter
document.getElementById("countBtn").addEventListener("click",function(){
    count++;
    document.getElementById("count").innerHTML="Count: "+count;
});

// Reset Counter
document.getElementById("resetBtn").addEventListener("click",function(){
    count=0;
    document.getElementById("count").innerHTML="Count: 0";
});

// Dark Mode
document.getElementById("darkBtn").addEventListener("click",function(){

    document.body.classList.toggle("dark");

    if(document.body.classList.contains("dark")){
        this.innerHTML="Light Mode";
    }
    else{
        this.innerHTML="Dark Mode";
    }

});

// Form Validation
document.getElementById("name").addEventListener("input",function(){

    let name=this.value;

    if(name.length<3){
        document.getElementById("error").innerHTML="Name must contain at least 3 characters.";
    }
    else{
        document.getElementById("error").innerHTML="";
    }

});
</script>
