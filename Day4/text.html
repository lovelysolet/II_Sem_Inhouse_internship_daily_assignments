<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Independence Day Registration</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:linear-gradient(135deg,#FF9933,#ffffff,#138808);
    overflow:auto;
}

.container{
    width:420px;
    background:#fff;
    border-radius:20px;
    padding:30px;
    box-shadow:0 15px 35px rgba(0,0,0,.3);
    animation:slide 1s ease;
}

@keyframes slide{
    from{
        transform:translateY(-50px);
        opacity:0;
    }
    to{
        transform:translateY(0);
        opacity:1;
    }
}

.logo{
    text-align:center;
    font-size:60px;
}

h2{
    text-align:center;
    color:#138808;
    margin:10px 0;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:20px;
}

.input-box{
    margin:15px 0;
}

.input-box label{
    display:block;
    margin-bottom:6px;
    font-weight:bold;
}

.input-box input,
.input-box select,
.input-box textarea{
    width:100%;
    padding:12px;
    border:2px solid #ddd;
    border-radius:10px;
    outline:none;
    transition:.3s;
    font-size:15px;
}

.input-box input:focus,
.input-box select:focus,
.input-box textarea:focus{
    border-color:#138808;
    box-shadow:0 0 8px rgba(19,136,8,.4);
}

textarea{
    resize:none;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:linear-gradient(90deg,#FF9933,#138808);
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:.4s;
    font-weight:bold;
}

button:hover{
    transform:scale(1.03);
}

.footer{
    text-align:center;
    margin-top:15px;
    color:#555;
    font-size:14px;
}

.popup{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%) scale(0);
    background:white;
    padding:30px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
    transition:.4s;
    z-index:1000;
}

.popup.active{
    transform:translate(-50%,-50%) scale(1);
}

.popup h3{
    color:#138808;
    margin-bottom:10px;
}

.popup button{
    margin-top:15px;
    width:120px;
}

.overlay{
    position:fixed;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.5);
    display:none;
    top:0;
    left:0;
}

.overlay.active{
    display:block;
}
</style>
</head>

<body>

<div class="container">

<div class="logo"></div>


<h2>Independence Day 2026</h2>

<p class="subtitle">Registration Form</p>

<form id="registrationForm">

<div class="input-box">
<label>Full Name</label>
<input type="text" id="name" required>
</div>

<div class="input-box">
<label>Email</label>
<input type="email" id="email" required>
</div>

<div class="input-box">
<label>Mobile Number</label>
<input type="tel" id="mobile" maxlength="10" required>
</div>

<div class="input-box">
<label>Gender</label>
<select id="gender" required>
<option value="">Select</option>
<option>Male</option>
<option>Female</option>
<option>Other</option>
</select>
</div>

<div class="input-box">
<label>Age</label>
<input type="number" id="age" required>
</div>

<div class="input-box">
<label>Choose Event</label>
<select id="event" required>
<option value="">Select Event</option>
<option>Speech Competition</option>
<option>Patriotic Song</option>
<option>Dance Performance</option>
<option>Drawing Competition</option>
<option>Quiz Competition</option>
<option>Flag March</option>
</select>
</div>

<div class="input-box">
<label>Address</label>
<textarea rows="3" id="address"></textarea>
</div>

<button type="submit">
Register Now
</button>

</form>

<div class="footer">
🇮🇳 Happy Independence Day 🇮🇳
</div>

</div>

<div class="overlay" id="overlay"></div>

<div class="popup" id="popup">
<h3>🎉 Registration Successful!</h3>
<p>Thank you for registering for the Independence Day Program.</p>
<button onclick="closePopup()">OK</button>
</div>

<script>

const form=document.getElementById("registrationForm");

form.addEventListener("submit",function(e){

e.preventDefault();

let name=document.getElementById("name").value.trim();
let email=document.getElementById("email").value.trim();
let mobile=document.getElementById("mobile").value.trim();
let age=document.getElementById("age").value;

if(name.length<3){
alert("Please enter a valid name.");
return;
}

let emailPattern=/^[^ ]+@[^ ]+\.[a-z]{2,3}$/;

if(!email.match(emailPattern)){
alert("Please enter a valid email.");
return;
}

if(!/^[0-9]{10}$/.test(mobile)){
alert("Enter a valid 10-digit mobile number.");
return;
}

if(age<5 || age>100){
alert("Please enter a valid age.");
return;
}

document.getElementById("popup").classList.add("active");
document.getElementById("overlay").classList.add("active");

form.reset();

});

function closePopup(){
document.getElementById("popup").classList.remove("active");
document.getElementById("overlay").classList.remove("active");
}

</script>

</body>
</html>
